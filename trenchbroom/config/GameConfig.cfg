{
    "version": 9,
    "name": "Neon",
    "icon": "Icon.png",
    "fileformats": [
        { "format": "Valve" }
    ],
    "filesystem": {
        "searchpath": ".",
        "packageformat": { "extension": ".pak", "format": "idpak" }
    },
    "materials": {
        "root": "textures",
        "extensions": [".png"]
    },
    "entities": {
        "definitions": [ "Neon.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0"
    },
    "tags": {
        "brush": [
            { "name": "Detail", "attribs": [], "match": "classname", "pattern": "func_detail*" },
            { "name": "Trigger", "attribs": [ "transparent" ], "match": "classname", "pattern": "trigger*", "material": "trigger" },
            { "name": "Func", "attribs": [], "match": "classname", "pattern": "func*" }
        ],
        "brushface": [
            { "name": "Clip", "attribs": [ "transparent" ], "match": "material", "pattern": "clip" },
            { "name": "Skip", "match": "material", "pattern": "skip" }
        ]
    },
    "faceattribs": { "surfaceflags": [], "contentflags": [] }
}
