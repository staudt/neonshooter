<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEON</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 18px;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #e8f6ff;
        font:
          600 14px/1.6 ui-monospace,
          monospace;
        letter-spacing: 0.2em;
        background: rgba(0, 0, 0, 0.55);
        cursor: pointer;
        user-select: none;
        z-index: 30;
      }
      #overlay.hidden {
        display: none;
      }
      #overlay .title {
        font-size: 42px;
        letter-spacing: 0.5em;
        color: #22e6ff;
        text-shadow: 0 0 18px #22e6ff;
      }
      #overlay .maps {
        display: flex;
        gap: 14px;
      }
      #overlay .maps a {
        color: #c9f6ff;
        text-decoration: none;
        border: 1px solid #c9f6ff55;
        padding: 6px 12px;
        font-size: 12px;
      }
      #overlay .maps a:hover,
      #overlay .maps a.current {
        background: #22e6ff22;
        border-color: #22e6ff;
      }
      #overlay .keys {
        font-size: 11px;
        letter-spacing: 0.08em;
        opacity: 0.7;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <div class="title">NEON</div>
      <div>CLICK TO PLAY</div>
      <div class="maps">
        <a href="?map=stage1" data-map="stage1">STAGE 1 · DESCENT</a>
        <a href="?map=station_slice" data-map="station_slice">STATION (LOOK SLICE)</a>
        <a href="?map=arena_test" data-map="arena_test">COMBAT ARENA</a>
        <a href="?map=test_course" data-map="test_course">MOVEMENT COURSE</a>
      </div>
      <div class="keys">
        WASD move · SHIFT sprint (again: tac sprint) · C slide/crouch · SPACE jump/mantle<br />
        LMB fire · RMB aim · R reload · E melee · Q shield · 1/2 weapons · ` settings &amp; tuning
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
